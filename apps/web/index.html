<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- ホーム画面に追加してアプリのように使う (#490)。Service Worker は使わない -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- ブラウザのUI色。DESIGN.md の background（夜祭の空）に合わせる -->
    <meta name="theme-color" content="#0E1426" />
    <!-- iOS は manifest の display を見ない機種が残るため、こちらでも指定する。
         アイコン下に出る名前も iOS はここを見る -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="events lab" />
    <title>events lab</title>
    <meta name="description" content="募集から配信まで全部やる。あらゆるイベントをまるごと運営できる、events lab（ベータ）。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="events lab" />
    <meta property="og:description" content="募集から配信まで全部やる。" />
    <meta property="og:image" content="https://events.kojira.io/og-default.png" />
    <meta property="og:url" content="https://events.kojira.io/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- フィード自動検出（RSS / JSON Feed）。iCal はカレンダー購読用 -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="events lab のイベント"
      href="/feed/events.rss"
    />
    <link
      rel="alternate"
      type="application/feed+json"
      title="events lab のイベント"
      href="/feed/events.json"
    />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="events lab のイベントのたまご"
      href="/feed/requests.rss"
    />
    <link
      rel="alternate"
      type="application/feed+json"
      title="events lab のイベントのたまご"
      href="/feed/requests.json"
    />
    <!-- AIエージェント向け: フィードとクエリ仕様の説明 -->
    <link
      rel="alternate"
      type="text/markdown"
      title="events lab (llms.txt)"
      href="/llms.txt"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
