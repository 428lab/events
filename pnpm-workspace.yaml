packages:
  # "." は cf（CI のデプロイ）のため。cf は pnpm workspace のルートで
  # cloudflare.config.ts を読めない（root of a workspace として弾く）ので、
  # ルート自身もワークスペースの1プロジェクトとして登録する。
  # pnpm -r はルートを含まないので、-r の対象は今までどおり apps/* と packages/*。
  - "."
  - "apps/*"
  - "packages/*"

# 公開から1週間経っていないバージョンは入れない。
# npm のサプライチェーン攻撃は、乗っ取ったアカウントから汚染バージョンを公開し、
# 発覚して取り下げられるまでの数時間〜数日のあいだに拾わせる形が多い。
# 待てば、その窓を過ぎたものだけを使える。
#
# 単位は分。10080 = 7日。
# 緊急の脆弱性修正など、待てないものを入れるときは minimumReleaseAgeExclude に
# パッケージ名を足すか、その回だけ設定を外す。理由をコミットメッセージに残すこと。
minimumReleaseAge: 10080
