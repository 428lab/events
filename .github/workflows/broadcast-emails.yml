# 一斉連絡 (#172) のメール送信待ちの消化
#
# アプリ内通知は送信時に届くが、メールは1リクエストで送れる件数に上限があるため
# 送信待ちを積んで少しずつ送る。リマインダー (#129) と同じく Workers の cron は
# アカウント上限で埋まっているので GitHub Actions から叩く。
# リマインダーは日次でよいがこちらは「数分で届く」ことが要るので別ワークフローにした。
#
# GitHub の定時実行は混雑時に遅れることがある。遅れても送信待ちは消えず
# 次の実行で続きから送られる。
name: Broadcast emails
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
# 前の実行が長引いたときに重ならないようにする（同じ送信待ちを二重に処理しない）
concurrency:
  group: broadcast-emails
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # CRON_SECRET が未設定のリポジトリ（fork 等）では 5分おきに job が失敗し、
      # 1日 288 回の失敗通知になる。日次のワークフローと違って桁が違うので、
      # 鍵が無いときは呼ばずに正常終了させる（設定漏れは下の警告で気づける）
      - name: Skip when CRON_SECRET is not configured
        id: guard
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET が未設定のため一斉連絡のメール送信をスキップしました"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Call broadcast email endpoint (production)
        if: steps.guard.outputs.configured == 'true'
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" -X POST \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            https://events.kojira.io/api/cron/broadcast-emails)
          cat /tmp/body; echo
          test "$code" = "200"
