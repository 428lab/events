name: CI

# 型チェックとテストは **すべての PR** で走る (#387)。
# デプロイはブランチ連動で、push のときだけ:
#   production ブランチ → 本番（eventer / events.kojira.io）
#   staging ブランチ    → staging（eventer-staging / *.workers.dev・管理者限定）
# デプロイの実体は cf（cloudflare.config.ts の --mode）。wrangler はローカル開発・
# テスト・D1 のマイグレーションで引き続き使う。
#
# ## ジョブの分け方（2026-11-27 オーナー「CI無駄なやつあったら整理したい」）
#
# 以前は1ジョブで server のテスト（約11分）→ web のテスト（約3分）を**順番に**流し、
# 1回あたり約15分かかっていた。server のテストの大半は「シャード1本ごとに workerd を
# 立ててマイグレーション130本を流す」固定の待ち時間で、CPU は空いている。
# そこで別々の runner に分けて**同時に**流す:
#
#   check（型チェック） ─┬─ server（4組。run-tests.mjs の TEST_GROUP で 20 シャードを配る）
#                        ├─ web（テスト。vitest --shard で2組）
#                        └─ build（web のビルド。dist を artifact にする）
#   deploy（push のときだけ）は上の全部が通ってから、build の dist を使って cf で出す。
#
# 依存の導入はキャッシュ込みで約10秒なので、ジョブごとに入れ直しても損は小さい。
# 1つの runner で同時に立つ workerd は今までどおり8本まで（run-tests.mjs #371）。
on:
  pull_request:
  push:
    branches: [production, staging]

# 同じ PR に push を重ねたら、古い実行は打ち切る。
# デプロイ（production / staging への push）は途中で止めると中途半端な状態に
# なりうるので打ち切らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 型チェックは数秒で済むので先に1回だけ。落ちたらテスト（数分）を待たずに止める
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # バージョンは root package.json の "packageManager" を参照（version 指定と重複させない）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventer/shared typecheck
      - run: pnpm --filter @eventer/server typecheck
      - run: pnpm --filter @eventer/web typecheck

  # server のテスト。20 シャード前後を4組に配って、4つの runner で同時に流す
  server:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      # 1組が落ちても残りは最後まで流す（どこが落ちたかを1回で分かるように）
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    name: server (${{ matrix.group }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventer/server test
        env:
          TEST_GROUP: ${{ matrix.group }}/4

  # web のテスト (#215)。投影用画面・登壇者サイドパネルに参加UIやスタッフ操作、
  # 匿名投稿者の実名が出ないことの退行防止（jsdom で実際に描画して確かめる）
  # 1本で約3分かかるので、vitest の --shard で2つの runner に分ける
  web:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: web (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--` を挟むと pnpm が vitest に引数ごと渡さず全件を流してしまうので、挟まない
      - run: pnpm --filter @eventer/web test --shard=${{ matrix.shard }}/2

  # フロントをビルド（tsc も走る。Worker の ASSETS バインディングが apps/web/dist を配信する）。
  # テストと同時に作っておき、deploy はこの dist をそのまま使う（同じコミットのビルドを2回しない）。
  # 閲覧数の計測 (#328) の識別子はここで渡す。
  # シークレット未設定のリポジトリでは空になり、計測は自動で無効になる
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventer/web build
        env:
          VITE_WEB_ANALYTICS_TOKEN: ${{ secrets.WEB_ANALYTICS_TOKEN }}
      # PR ではデプロイしないので渡す先が無い。push のときだけ残す
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  # ここから下だけがデプロイ。PR では走らない。型チェック・テスト・ビルドが全部通ったときだけ
  #
  # デプロイは cf（cloudflare/cf のベータ CLI）。設定はリポジトリ直下の
  # cloudflare.config.ts にあり、`--mode` で環境を選ぶ（staging / production）。
  # モード無しと production は同じ本番設定（[env.production] は無い）。
  # cf は自分でビルドするが、配信する apps/web/dist は先に作っておく必要がある（build の artifact）。
  #
  # 戻すときは、この2ステップの run を wrangler に戻すだけでよい:
  #   production: pnpm --filter @eventer/server run deploy
  #   staging:    pnpm --filter @eventer/server run deploy:staging
  deploy:
    if: github.event_name == 'push'
    needs: [check, server, web, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Deploy to production
        if: github.ref == 'refs/heads/production'
        run: pnpm run deploy:cf:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to staging
        if: github.ref == 'refs/heads/staging'
        run: pnpm run deploy:cf:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
