name = "eventer"
main = "apps/server/src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "b9cec3916d500760a7c7b9c31c720d80"
workers_dev = true

# 本番ドメイン: Worker ルートでエッジ処理（既存DNSを触らずトンネルを上書き）。
# DNS は events.kojira.io の CNAME（旧トンネル）をそのまま残してよい——
# ルートにマッチしたリクエストはオリジン(トンネル)へ行かず Worker が直接応答する。
routes = [{ pattern = "events.kojira.io/*", zone_name = "kojira.io" }]

# React ビルドを同一 Worker から配信（/events/:id の OG メタ注入のため単一Worker構成）。
# run_worker_first: 全リクエストをまず Worker が受け、/api と /events/:id を処理。
# それ以外は Worker 内から ASSETS.fetch で配信（SPA フォールバックで index.html）。
assets = { directory = "apps/web/dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = true }

# 前日リマインダーメール (#126)。毎日 UTC 0:00 = JST 9:00
[triggers]
crons = ["0 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "eventer"
database_id = "977fc3ef-3806-48fe-9019-918f54989279"
migrations_dir = "apps/server/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "eventer-images"

[vars]
ENVIRONMENT = "production"
APP_BASE_URL = "https://events.kojira.io"
ADMIN_DISCORD_IDS = "390732846236434452"
DISCORD_REDIRECT_URI = "https://events.kojira.io/api/auth/discord/callback"

# シークレットは `wrangler secret put` で登録（wrangler.toml には書かない）:
#   DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, SESSION_SECRET
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
#   X_CLIENT_ID, X_CLIENT_SECRET（X Developer Portal の OAuth2 Web App。
#   Callback URL: <APP_BASE_URL>/api/auth/x/callback を本番/stagingそれぞれ登録）
#   RESEND_API_KEY（メール通知 #126。未設定ならメール送信は無効。
#   差出人は EMAIL_FROM で上書き可、既定は "events lab <noreply@kojira.io>"）

# ===== staging 環境（管理者ログイン限定）=====
# デプロイ: wrangler deploy --env staging
# URL: https://eventer-staging.kojiran.workers.dev（workers.dev・別D1/R2）
[env.staging]
name = "eventer-staging"
workers_dev = true
routes = []  # staging はカスタムルートを使わず workers.dev のみ（本番ルートの継承を打ち消す）
assets = { directory = "apps/web/dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = true }

# 前日リマインダーメール (#126)。staging も同時刻に実行
[[env.staging.d1_databases]]
binding = "DB"
database_name = "eventer-staging"
database_id = "389e4625-8e13-4a41-9530-3ab3be10cee5"
migrations_dir = "apps/server/migrations"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "eventer-images-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
APP_BASE_URL = "https://eventer-staging.kojiran.workers.dev"
ADMIN_DISCORD_IDS = "390732846236434452"
DISCORD_REDIRECT_URI = "https://eventer-staging.kojiran.workers.dev/api/auth/discord/callback"
